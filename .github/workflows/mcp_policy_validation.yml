name: MCP policy Python 3.13 validation

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, labeled]
  push:
    branches: [feat/05-mcp-plugin-hub]
    paths:
      - .ci/mcp-validation.trigger

permissions:
  contents: read

jobs:
  mcp-policy-tests:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/feat/05-mcp-plugin-hub') ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'feat/05-mcp-plugin-hub' &&
       (github.event.action == 'ready_for_review' ||
        github.event.label.name == 'ci:validate'))
    name: MCP policy unittest on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check Python syntax without bytecode writes
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8'),filename=str(p)) for d in ('holding','tests') for p in pathlib.Path(d).rglob('*.py')]"
      - name: Run complete MCP policy unittest collection
        run: python -B -X utf8 -m unittest discover -s tests -p "test_*.py" -v
      - name: Require clean checkout after tests
        shell: bash
        run: 'test -z "$(git status --porcelain --untracked-files=normal)"'
