name: Updater Control Center integration (opt-in)

on:
  pull_request:
    branches: [feat/integration-137]
    types: [labeled]
permissions:
  contents: read
jobs:
  scoped-update-ui:
    if: github.event.label.name == 'ci:updater-integration'
    name: Update status and Control Center (Linux/Windows)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Linux Qt requirements
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1
      - name: Install exact Control Center Qt runtime
        run: python -m pip install --disable-pip-version-check PySide6==6.12.0
      - name: Parse Python sources
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for d in ('holding','tests') for p in pathlib.Path(d).rglob('*.py')]"
      - name: Exercise engine Control Center and new update integration
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          for module in test_update_stage.py test_update_switch.py test_update_observation.py test_update_control_center_ui.py test_control_center_entry.py test_control_center_live.py test_dashboard_session.py test_daemon_entry.py; do
            python -B -X utf8 -m unittest discover -s tests -p "$module" -v
          done
      - name: Ensure tests did not modify checkout
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=normal)"

  frozen-windows-viewer:
    if: github.event.label.name == 'ci:updater-integration'
    name: Windows native frozen updater UI smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned GUI and frozen build runtime
        run: python -m pip install --disable-pip-version-check PySide6==6.12.0 pyinstaller==6.22.3
      - name: Build and smoke genuine Control Center EXE (nonrelease)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $out = Join-Path $env:RUNNER_TEMP "holding-updater-ui-$env:GITHUB_RUN_ID"
          python -B -m holding.windows_control_center_build --kind viewer --output-dir "$out"
          if ($LASTEXITCODE -ne 0) { throw "Native Control Center build failed" }
          $exe = Join-Path $out "AtlasHoldingControlCenter.exe"
          if (!(Test-Path $exe) -or (Get-Item $exe).Length -lt 1000000) { throw "Frozen viewer missing" }
          $selfTest = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "Frozen Qt self-test failed" }
          Write-Output "NONRELEASE_UPDATER_CONTROL_CENTER_VIEWER_PASS"
