name: Bootstrap Python 3.13 validation

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, labeled]
  push:
    branches: [feat/02-windows-bootstrap]
    paths: [.ci/bootstrap-validation.trigger]

permissions:
  contents: read

jobs:
  bootstrap-tests:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'feat/02-windows-bootstrap') ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'feat/02-windows-bootstrap' &&
       (github.event.action == 'ready_for_review' ||
        github.event.label.name == 'ci:validate'))
    name: Bootstrap unittest on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check Python syntax without bytecode writes
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8'),filename=str(p)) for d in ('holding','tests') for p in pathlib.Path(d).rglob('*.py')]"
      - name: Run complete bootstrap unittest collection
        run: python -B -X utf8 -m unittest discover -s tests -p "test_*.py" -v
      - name: Require clean checkout after tests
        shell: bash
        run: 'test -z "$(git status --porcelain --untracked-files=normal)"'
      - name: Verify official portable MinGit with real Windows VCS operations
        if: matrix.os == 'windows-latest' && (github.event_name == 'push' || github.event.label.name == 'ci:validate')
        shell: pwsh
        timeout-minutes: 8
        run: |
          $url = "https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.2/MinGit-2.56.0.2-64-bit.zip"
          $expected = "da35e72aa21c005a5a0d298cfbae110bc1609a815730ea0dde84b01a1b3cd3be"
          $zip = Join-Path $env:RUNNER_TEMP "Atlas-MinGit-official-$expected.zip"
          try {
            Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRedirection 5 -TimeoutSec 120
            if (!(Test-Path $zip)) { throw "Publisher archive missing" }
            $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Publisher SHA256 mismatch" }
            python -B -X utf8 -m holding.mingit_smoke --archive "$zip"
            if ($LASTEXITCODE -ne 0) { throw "Real portable MinGit VCS smoke failed" }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $zip
          }
      - name: Install pinned Windows build packager
        if: matrix.os == 'windows-latest' && (github.event_name == 'push' || github.event.label.name == 'ci:validate')
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "pyinstaller==6.22.3"
      - name: Package nonrelease Windows EXE with fixed unusable manifest
        if: matrix.os == 'windows-latest' && (github.event_name == 'push' || github.event.label.name == 'ci:validate')
        shell: pwsh
        run: |
          $fixture = (Resolve-Path "tests/fixtures/bootstrap_smoke_assets.json").Path
          $pin = (Get-FileHash -Algorithm SHA256 $fixture).Hash.ToLowerInvariant()
          $dest = Join-Path $PWD "smoke-output"
          python -B -m holding.windows_build --manifest "$fixture" --manifest-sha256 "$pin" --output-dir "$dest"
          if ($LASTEXITCODE -ne 0) { throw "Windows setup EXE packaging failed" }
          $exe = Join-Path $dest "AtlasHoldingSetup.exe"
          if (!(Test-Path $exe) -or (Get-Item $exe).Length -lt 1000000) { throw "Setup artifact invalid" }
          Write-Output "NONRELEASE: test asset cannot install real dependencies"
          Write-Output "SHA256: $((Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant())"
      - name: Execute packaged Windows manifest self-test
        if: matrix.os == 'windows-latest' && (github.event_name == 'push' || github.event.label.name == 'ci:validate')
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "smoke-output/AtlasHoldingSetup.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged self-test failed: $($p.ExitCode)" }
      - name: Verify packaged logon resume refuses missing enrollment without UI
        if: matrix.os == 'windows-latest' && (github.event_name == 'push' || github.event.label.name == 'ci:validate')
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "smoke-output/AtlasHoldingSetup.exe"
          $invalid = Join-Path $PWD "smoke-output/not-registered"
          $p = Start-Process -FilePath $exe -ArgumentList @("--resume-ollama", $invalid) -PassThru -Wait
          if ($p.ExitCode -ne 2) { throw "Missing logon enrollment did not fail closed: $($p.ExitCode)" }
      - name: Remove nonrelease EXE and verify checkout
        if: matrix.os == 'windows-latest' && (github.event_name == 'push' || github.event.label.name == 'ci:validate')
        shell: pwsh
        run: |
          Remove-Item -Force -Recurse "smoke-output"
          $changes = git status --porcelain --untracked-files=normal
          if ($changes) { throw "Bootstrap source modified by packaging: $changes" }
