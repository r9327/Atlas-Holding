name: Bootstrap Python 3.13 validation

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, labeled]

permissions:
  contents: read

jobs:
  bootstrap-tests:
    if: >-
      github.head_ref == 'feat/02-windows-bootstrap' &&
      (github.event.action == 'ready_for_review' ||
       github.event.label.name == 'ci:validate')
    name: Bootstrap unittest on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check Python syntax without bytecode writes
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8'),filename=str(p)) for d in ('holding','tests') for p in pathlib.Path(d).rglob('*.py')]"
      - name: Run complete bootstrap unittest collection
        run: python -B -X utf8 -m unittest discover -s tests -p "test_*.py" -v
      - name: Require clean checkout after tests
        shell: bash
        run: 'test -z "$(git status --porcelain --untracked-files=normal)"'
      - name: Install pinned Windows build packager
        if: matrix.os == 'windows-latest' && github.event.label.name == 'ci:validate'
        run: python -m pip install --disable-pip-version-check --only-binary=:all: "pyinstaller==6.22.3"
      - name: Package nonrelease Windows EXE with fixed unusable manifest
        if: matrix.os == 'windows-latest' && github.event.label.name == 'ci:validate'
        shell: pwsh
        run: |
          $fixture = (Resolve-Path "tests/fixtures/bootstrap_smoke_assets.json").Path
          $pin = (Get-FileHash -Algorithm SHA256 $fixture).Hash.ToLowerInvariant()
          $dest = Join-Path $PWD "smoke-output"
          python -B -m holding.windows_build --manifest "$fixture" --manifest-sha256 "$pin" --output-dir "$dest"
          if ($LASTEXITCODE -ne 0) { throw "Windows setup EXE packaging failed" }
          $exe = Join-Path $dest "AtlasHoldingSetup.exe"
          if (!(Test-Path $exe) -or (Get-Item $exe).Length -lt 1000000) { throw "Setup artifact invalid" }
          Write-Output "NONRELEASE: test asset cannot install real dependencies"
          Write-Output "SHA256: $((Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant())"
      - name: Execute packaged Windows manifest self-test
        if: matrix.os == 'windows-latest' && github.event.label.name == 'ci:validate'
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "smoke-output/AtlasHoldingSetup.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged self-test failed: $($p.ExitCode)" }
      - name: Remove nonrelease EXE and verify checkout
        if: matrix.os == 'windows-latest' && github.event.label.name == 'ci:validate'
        shell: pwsh
        run: |
          Remove-Item -Force -Recurse "smoke-output"
          $changes = git status --porcelain --untracked-files=normal
          if ($changes) { throw "Bootstrap source modified by packaging: $changes" }
