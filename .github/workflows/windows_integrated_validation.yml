name: Integrated Windows installer and local agent

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  combined-contract:
    if: >-
      github.head_ref == 'integration/windows-agent-bootstrap-20261022' &&
      github.event.label.name == 'ci:validate'
    name: Combined Python 3.13 and native Windows on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Qt host dependency on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1
      - name: Install UI test dependency
        run: python -m pip install --disable-pip-version-check PySide6==6.12.0
      - name: Parse every Holding and test Python file
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for d in ('holding','tests') for p in pathlib.Path(d).rglob('*.py')]"
      - name: Run complete combined regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B -X utf8 -m unittest discover -s tests -p "test_*.py" -v
      - name: Install native Windows packager
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check --only-binary=:all: "pyinstaller==6.22.3"
      - name: Freeze native GUI, engine and Ollama adapter; verify embedded Setup
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 27
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          $candidate = Join-Path $env:RUNNER_TEMP "atlas-integrated-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $candidate -Force | Out-Null
          python -B -m holding.windows_control_center_build --kind all --output-dir "$candidate"
          if ($LASTEXITCODE -ne 0) { throw "Three real Windows executables did not freeze" }
          $viewer = Join-Path $candidate "AtlasHoldingControlCenter.exe"
          $engine = Join-Path $candidate "AtlasHoldingEngine.exe"
          $agent = Join-Path $candidate "AtlasHoldingAgent.exe"
          foreach ($path in @($viewer, $engine, $agent)) {
            if (!(Test-Path $path) -or (Get-Item $path).Length -lt 1000000) {
              throw "Missing or incomplete native executable: $path"
            }
          }
          python -B -X utf8 tests/native_windows_runtime_smoke.py --viewer "$viewer" --engine "$engine"
          if ($LASTEXITCODE -ne 0) { throw "Frozen GUI and engine IPC failed" }
          python -B -X utf8 tests/native_windows_agent_smoke.py --agent "$agent"
          if ($LASTEXITCODE -ne 0) { throw "Frozen local agent protocol failed" }
          $manifest = Join-Path $PWD "tests/fixtures/bootstrap_smoke_assets.json"
          $manifestSha = (Get-FileHash -Algorithm SHA256 "$manifest").Hash.ToLowerInvariant()
          $viewerSha = (Get-FileHash -Algorithm SHA256 "$viewer").Hash.ToLowerInvariant()
          $engineSha = (Get-FileHash -Algorithm SHA256 "$engine").Hash.ToLowerInvariant()
          $agentSha = (Get-FileHash -Algorithm SHA256 "$agent").Hash.ToLowerInvariant()
          $installer = Join-Path $env:RUNNER_TEMP "atlas-integrated-setup-$env:GITHUB_RUN_ID"
          python -B -m holding.windows_build --manifest "$manifest" --manifest-sha256 "$manifestSha" --output-dir "$installer" --runtime-directory "$candidate" --viewer-sha256 "$viewerSha" --engine-sha256 "$engineSha" --adapter-executable "$agent" --adapter-sha256 "$agentSha"
          if ($LASTEXITCODE -ne 0) { throw "Setup did not embed real SHA-pinned triple" }
          $setup = Join-Path $installer "AtlasHoldingSetup.exe"
          if (!(Test-Path $setup) -or (Get-Item $setup).Length -lt 1000000) { throw "Frozen installer missing" }
          $selfTest = Start-Process -FilePath "$setup" -ArgumentList '--self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "Frozen real-asset Setup self-test failed" }
          Write-Output "NONRELEASE_INTEGRATED_THREE_BINARY_SETUP_SELF_TEST_PASS"
          Write-Output "Setup SHA256: $((Get-FileHash -Algorithm SHA256 "$setup").Hash.ToLowerInvariant())"
          Write-Output "Agent SHA256: $agentSha"
      - name: Require a clean checkout after all contracts
        shell: bash
        run: 'test -z "$(git status --porcelain --untracked-files=normal)"'
