name: Feature-scoped proof (opt-in)
on:
  pull_request:
    types: [labeled, ready_for_review, synchronize]
permissions:
  contents: read
jobs:
  pure-python:
    if: >-
      github.event.label.name == 'ci:feature-scoped' ||
      (github.event.pull_request.draft == false &&
       contains(github.event.pull_request.labels.*.name, 'ci:feature-scoped'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: New feature isolated tests (only present modules)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          candidates = (
              "test_inventory_cli.py", "test_inventory.py",
              "test_provision_plan.py", "test_roadmap_contract.py",
              "test_document_intake.py", "test_document_csv.py",
              "test_document_exchange.py", "test_document_source.py",
              "test_documentalist_cli.py", "test_document_html.py",
              "test_document_cache.py", "test_document_markdown.py",
              "test_document_folder.py", "test_project_profile.py",
              "test_project_profile_cli.py", "test_project_profile_examples.py",
              "test_project_registry.py", "test_project_registry_cli.py",
              "test_project_plan_binding.py", "test_project_mission_gate.py",
              "test_roadmap_contract.py", "test_roadmap_control_intake.py",
              "test_roadmap_replan.py", "test_markdown_roadmap.py",
              "test_code_worker.py", "test_ollama_protocol.py",
              "test_update_plan.py", "test_update_download.py",
              "test_update_manifest_client.py", "test_update_probe.py",
              "test_update_probe_cli.py", "test_update_stage.py",
              "test_update_switch.py",
              "test_sqlite_backup.py", "test_migrations.py",
              "test_github_privileged_transport.py", "test_github_privileged_worker.py",
              "test_github_mutation_gate.py", "test_sync_coordinator.py",
              "test_schema_authority.py",
          )
          present = [name for name in candidates if (Path("tests") / name).is_file()]
          if not present:
              raise SystemExit("No new feature tests in this branch")
          for name in present:
              print("Testing", name, flush=True)
              subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "tests", "-p", name, "-v"], check=True)
          PY
      - name: Verify versioned autonomy roadmap when present
        if: hashFiles('docs/roadmap/HOLDING_AUTONOMY_V2_2026-10-28.plan.json') != ''
        env:
          ROADMAP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          from holding.roadmap_contract import validate_roadmap_plan
          source = Path("docs/roadmap/HOLDING_AUTONOMY_V2_2026-10-28.md")
          plan = source.with_suffix(".plan.json")
          validate_roadmap_plan(
              plan.read_bytes(), expected_repository="r9327/Atlas-Holding",
              expected_snapshot_sha=os.environ["ROADMAP_BASE_SHA"],
              expected_source_digest=hashlib.sha256(source.read_bytes()).hexdigest(),
          )
          print("Roadmap coverage, dependencies, source and base verified; no missions executed")
          PYCODE
      - name: Checkout clean after tests
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=normal)"
