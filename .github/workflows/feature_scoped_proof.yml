name: Feature-scoped proof (opt-in)
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  pure-python:
    if: github.event.label.name == 'ci:feature-scoped'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: New feature isolated tests (only present modules)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          candidates = ("test_document_intake.py", "test_project_profile.py", "test_update_plan.py", "test_update_download.py", "test_update_manifest_client.py")
          present = [name for name in candidates if (Path("tests") / name).is_file()]
          if not present:
              raise SystemExit("No new feature tests in this branch")
          for name in present:
              print("Testing", name, flush=True)
              subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "tests", "-p", name, "-v"], check=True)
          PY
