name: Feature-scoped proof (opt-in)
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  pure-python:
    if: github.event.label.name == 'ci:feature-scoped'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: New feature isolated tests (only present modules)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          candidates = (
              "test_document_intake.py", "test_document_csv.py",
              "test_document_exchange.py", "test_document_source.py",
              "test_documentalist_cli.py", "test_document_html.py",
              "test_document_cache.py", "test_document_markdown.py",
              "test_document_folder.py", "test_project_profile.py",
              "test_project_profile_cli.py", "test_project_profile_examples.py",
              "test_project_registry.py", "test_project_registry_cli.py",
              "test_project_plan_binding.py", "test_project_mission_gate.py",
              "test_roadmap_contract.py", "test_roadmap_control_intake.py",
              "test_roadmap_replan.py", "test_markdown_roadmap.py",
              "test_code_worker.py", "test_ollama_protocol.py",
              "test_research_brief.py", "test_project_chat.py",
              "test_research_workplan.py", "test_research_simulation.py",
              "test_ngspice_adapter.py", "test_research_measurement.py",
              "test_update_plan.py", "test_update_download.py",
              "test_update_manifest_client.py", "test_update_probe.py",
              "test_update_probe_cli.py", "test_update_stage.py",
              "test_update_switch.py",
          )
          present = [name for name in candidates if (Path("tests") / name).is_file()]
          if not present:
              raise SystemExit("No new feature tests in this branch")
          for name in present:
              print("Testing", name, flush=True)
              subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "tests", "-p", name, "-v"], check=True)
          PY
      - name: Checkout clean after tests
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=normal)"
