name: Holding PR Python and AI certification

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holding-pr-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-policy:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      github.event.label.name == 'ci:validate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify exact candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate AI and tool contracts
        run: python -B -X utf8 -m tools.ai_policy_check
      - name: Test contract enforcement
        run: python -B -X utf8 -m unittest discover -s tests -p 'test_ai_policy_check.py' -v
      - name: Require clean checkout
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=normal)"

  cross-platform-tests:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      github.event.label.name == 'ci:validate'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify exact candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install Linux Qt dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1
      - name: Install existing UI test dependency
        run: python -m pip install --disable-pip-version-check PySide6==6.12.0
      - name: Check Python syntax
        run: python -B -X utf8 -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8'),filename=str(p)) for d in ('holding','tests','tools') for p in pathlib.Path(d).rglob('*.py')]"
      - name: Full Python regression suite
        run: python -B -X utf8 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Require clean checkout
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=normal)"
